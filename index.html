function repeatLinkObject(source, times) {
    const repeated = {};
    let index = 1;
    Object.values(source).forEach(value => {
        for (let count = 0; count < times; count += 1) {
            repeated[`link${index}`] = value;
            index += 1;
        }
    });
    return repeated;
}

const link = repeatLinkObject(originalLinks, 4);
const valuea = Object.values(link);
let i = 0;
const but = document.getElementById("but");
let interval;

but.addEventListener("click", () => {
    if (interval) {
        clearInterval(interval);
    }
    i = 0;
    interval = setInterval(() => {
        if (i < valuea.length) {
            window.open(valuea[i], "_blank");
            i += 1;
        } else {
            clearInterval(interval);
        }
    }, 3000);
});
